[package]
name = "waybar-pomodoro"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
description = "pomodoro timer for waybar"
license = "MIT"

[dependencies]
rustix = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = "thin"
strip = true
